<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <g transform="translate(256, 256)">
    <!-- Hand silhouette -->
    <ellipse cx="-40" cy="20" rx="60" ry="80" fill="white" opacity="0.9"/>
    <!-- Fingers -->
    <rect x="-80" y="-100" width="20" height="80" rx="10" fill="white" opacity="0.9"/>
    <rect x="-50" y="-120" width="20" height="100" rx="10" fill="white" opacity="0.9"/>
    <rect x="-20" y="-130" width="20" height="110" rx="10" fill="white" opacity="0.9"/>
    <rect x="10" y="-110" width="20" height="90" rx="10" fill="white" opacity="0.9"/>
    <!-- Nails -->
    <ellipse cx="-70" cy="-100" rx="12" ry="15" fill="#fbbf24"/>
    <ellipse cx="-40" cy="-120" rx="12" ry="15" fill="#fbbf24"/>
    <ellipse cx="-10" cy="-130" rx="12" ry="15" fill="#fbbf24"/>
    <ellipse cx="20" cy="-110" rx="12" ry="15" fill="#fbbf24"/>
    <!-- Sparkles -->
    <circle cx="60" cy="-80" r="4" fill="#fde047"/>
    <circle cx="80" cy="-40" r="3" fill="#fde047"/>
    <circle cx="70" cy="0" r="5" fill="#fde047"/>
  </g>
</svg>
